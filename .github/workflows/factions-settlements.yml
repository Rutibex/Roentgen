name: Factions and Settlements
on:
  push:
  pull_request:
jobs:
  phase15:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Roentgen.sln
      - run: dotnet build Roentgen.sln -c Release --no-restore
      - run: dotnet test tests/Roentgen.Factions.Tests/Roentgen.Factions.Tests.csproj -c Release --no-build
      - run: dotnet run --project tools/Roentgen.FactionLab -c Release --no-build -- smoke
      - run: dotnet run --project tools/Roentgen.FactionLab -c Release --no-build -- replay 3650
      - run: python eng/verify_phase15_contracts.py
      - run: python eng/verify_phase15_vectors.py
      - run: python eng/validate_repository.py

name: Integrated Playroma Sound Runtime
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase18-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: python eng/verify_phase18_contracts.py
      - run: python eng/verify_phase18_vectors.py
      - run: dotnet restore Roentgen.sln
      - run: dotnet build Roentgen.sln -c Release --no-restore
      - run: dotnet test tests/Roentgen.Audio.Tests/Roentgen.Audio.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet test tests/Roentgen.Audio.Playroma.Tests/Roentgen.Audio.Playroma.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet test tests/Roentgen.Audio.MonoGame.Tests/Roentgen.Audio.MonoGame.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet test tests/Roentgen.Audio.StressTests/Roentgen.Audio.StressTests.csproj -c Release --no-build --no-restore
      - run: dotnet run --project tools/Roentgen.AudioLab/Roentgen.AudioLab.csproj -c Release --no-build -- validate

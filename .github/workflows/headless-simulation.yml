name: Headless Simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 2,5'

permissions:
  contents: read

jobs:
  smoke-and-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Roentgen.sln
      - name: Build headless shell
        run: dotnet build src/Roentgen.Headless/Roentgen.Headless.csproj -c Release --no-restore
      - name: Phase 3 tests
        run: dotnet test tests/Roentgen.Headless.Tests/Roentgen.Headless.Tests.csproj -c Release --no-restore
      - name: Run smoke, snapshot, and replay
        shell: pwsh
        run: ./eng/headless-smoke.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-smoke-${{ matrix.os }}
          path: artifacts/headless-smoke

  repeated-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Roentgen.sln
      - name: Repeated multi-seed soak
        run: ./eng/soak.sh 25 10000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-soak
          path: artifacts/soak

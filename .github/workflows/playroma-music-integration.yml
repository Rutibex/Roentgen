name: Playroma Music integration
on:
  push:
    paths: ['src/PlayromaMusic.**/**','src/Roentgen.Music/**','src/Roentgen.Music.Playroma/**','content/music/**','tests/Roentgen.Music.**/**','tools/Roentgen.MusicLab/**','eng/verify_phase19_*.py']
  pull_request:
  workflow_dispatch:
jobs:
  phase19:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python eng/verify_phase19_contracts.py
      - run: python eng/verify_phase19_vectors.py
      - run: dotnet restore Roentgen.sln
      - run: dotnet build Roentgen.sln -c Release --no-restore
      - run: dotnet test tests/Roentgen.Music.Tests/Roentgen.Music.Tests.csproj -c Release --no-build
      - run: dotnet test tests/Roentgen.Music.Playroma.Tests/Roentgen.Music.Playroma.Tests.csproj -c Release --no-build
      - run: dotnet test tests/Roentgen.Music.StressTests/Roentgen.Music.StressTests.csproj -c Release --no-build
      - run: dotnet run --project tools/Roentgen.MusicLab/Roentgen.MusicLab.csproj -c Release --no-build -- validate

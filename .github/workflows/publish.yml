name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (manual build only)'
        required: true
        default: '0.21.0-preview'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REQUESTED_VERSION:-$REF_NAME}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Restore
        run: dotnet restore src/Roentgen.App/Roentgen.App.csproj
      - name: Publish
        shell: bash
        run: bash ./eng/publish.sh "${{ matrix.rid }}" "$VERSION"
      - name: Archive Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/Roentgen-${{ matrix.rid }}.zip"
      - name: Archive Linux
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C "artifacts/publish/${{ matrix.rid }}" -czf "artifacts/Roentgen-${{ matrix.rid }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: Roentgen-${{ matrix.rid }}
          path: artifacts/Roentgen-${{ matrix.rid }}.*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Roentgen-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum Roentgen-* > SHA256SUMS.txt
      - name: Publish tagged GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" dist/Roentgen-* dist/SHA256SUMS.txt \
            --title "Roentgen $TAG (preview)" --prerelease \
            --notes "Development preview; see the repository README, CHANGELOG and third-party notices. Older saves may not load."

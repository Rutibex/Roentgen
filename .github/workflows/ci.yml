name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        run: dotnet tool restore
      - name: Install validation dependencies
        run: python -m pip install jsonschema PyYAML
      - name: Validate repository
        run: python eng/validate_repository.py
      - name: Verify deterministic vectors
        run: python eng/verify_golden_vectors.py
      - name: Verify replay fixture
        run: python eng/verify_replay_fixture.py
      - name: Restore
        run: dotnet restore Roentgen.sln
      - name: Build
        run: dotnet build Roentgen.sln -c Release --no-restore
      - name: Test
        run: dotnet test Roentgen.sln -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

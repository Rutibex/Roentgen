name: Determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  repeat-determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify reference vectors
        run: python eng/verify_golden_vectors.py
      - name: Verify replay fixture
        run: python eng/verify_replay_fixture.py
      - name: Restore
        run: dotnet restore tests/Roentgen.Determinism.Tests/Roentgen.Determinism.Tests.csproj
      - name: Repeat deterministic core tests
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            Write-Host "Determinism pass $_ of 10"
            dotnet test tests/Roentgen.Determinism.Tests/Roentgen.Determinism.Tests.csproj -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
